services:
  bot:
    build: .
    image: telegram-ai-assistant-starter:latest
    container_name: telegram-ai-assistant
    restart: unless-stopped
    env_file:
      - .env
    # Storage is Supabase (managed), so the container itself is stateless.
    healthcheck:
      test: ["CMD", "python", "-c", "import app; print(app.__version__)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
